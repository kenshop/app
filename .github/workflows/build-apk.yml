name: Build and Release Glass Bridge Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets for Capacitor
        run: npm run build

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Dynamic APK Package Name
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk glass-bridge-v3.0.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk glass-bridge-v3-latest.apk

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Bridge-Game-APK-v3-${{ github.run_number }}
          path: glass-bridge-v3.0.${{ github.run_number }}.apk

      - name: Create Automatic GitHub Release for Direct Mobile Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: 🚀 نسخه ۳.۰ (بدون لگ + سیستم ۱۰ جان قطعی)
          body: |
            📱 **دانلود مستقیم فایل جدید APK نسخه v3.0.${{ github.run_number }}**
            
            ✅ **تغییرات اساسی نسخه ۳.۰:**
            - **رفع کامل لگ روی گوشی**: بهینه‌سازی رندرینگ Canvas و حذف شادوی سنگین (۶۰ فریم بر ثانیه روانی کامل).
            - **رفع لگ و تاخیر صدا**: پیش‌محاسبه افکت‌های صوتی Web Audio برای اجرای آنی و بدون قطعی.
            - **نمایش قطعی ۱۰ جان در HUD**: نشانگر ویژه `❤️ ۱۰ / ۱۰ جان` به همراه ۱۰ نقطه بنفش/صورتی که هیچگاه در گوشی کوچک نمی‌شوند یا کات نمی‌خورند.
            - **سیستم کم شدن ۱ جان هوشمند**: با هر اشتباه ۱ جان کم شده، پیام تراز `💔 ۱ جان کم شد!` ظاهر می‌شود، بازیکن روی آخرین شیشه امن برمی‌گردد و امتیاز حفظ می‌شود.
            - **نمایش کادر باخت (Game Over)**: تنها و تنها زمانی که هر ۱۰ جان تمام شدند.

            👇 **جهت دانلود مستقیم روی لینک زیر کلیک کنید:**
            `glass-bridge-v3.0.${{ github.run_number }}.apk`
          draft: false
          prerelease: false
          make_latest: true
          files: |
            glass-bridge-v3.0.${{ github.run_number }}.apk
            glass-bridge-v3-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
