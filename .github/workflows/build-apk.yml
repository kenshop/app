name: Build and Release Glass Bridge Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Fresh Web Assets for Capacitor
        run: npm run build

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Dynamic APK Package Name
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk glass-bridge-v2.0.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk glass-bridge-latest.apk

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Bridge-Game-APK-${{ github.run_number }}
          path: glass-bridge-v2.0.${{ github.run_number }}.apk

      - name: Create Automatic GitHub Release for Direct Mobile Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: 🔥 نسخه اصلاح‌شده و نهایی (v2.0.${{ github.run_number }})
          body: |
            📱 **دانلود مستقیم APK اصلاح‌شده (نسخه v2.0.${{ github.run_number }})**
            
            ✅ **تغییرات نهایی اعمال‌شده:**
            - پاک‌سازی کامل کش قبلی مرورگر گوشی (Cache-Busting v200)
            - اصلاح کامل ۱۰ جان (اسپاون روی آخرین شیشه امن)
            - عدم نمایش کادر باخت تا زمانی که تمام ۱۰ جان تمام شوند

            👇 **از بخش Assets پایین دانلود کنید:**
            `glass-bridge-v2.0.${{ github.run_number }}.apk`
          draft: false
          prerelease: false
          make_latest: true
          files: |
            glass-bridge-v2.0.${{ github.run_number }}.apk
            glass-bridge-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
