name: Build and Release Glass Bridge Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets for Capacitor
        run: npm run build

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Package
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk glass-bridge-v1.0.apk

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Bridge-Game-APK
          path: glass-bridge-v1.0.apk

      - name: Create Automatic GitHub Release for Direct Mobile Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: دانلود اپلیکیشن پل شیشه‌ای v1.0.${{ github.run_number }}
          body: |
            📱 **لینک دانلود مستقیم فایل APK اندروید**
            روی فایل `glass-bridge-v1.0.apk` در قسمت **Assets** پایین کلیک کنید تا مستقیماً روی گوشی دانلود و نصب شود.
          draft: false
          prerelease: false
          files: glass-bridge-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
