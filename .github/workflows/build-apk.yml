name: Build and Release Glass Bridge Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets for Capacitor
        run: npm run build

      - name: Initialize & Force Copy Assets to Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Dynamic APK Package Name
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk glass-bridge-v4.0.${{ github.run_number }}.apk

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Bridge-Game-APK-v4-${{ github.run_number }}
          path: glass-bridge-v4.0.${{ github.run_number }}.apk

      - name: Create Automatic GitHub Release for Direct Mobile Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: 🔥 بازنویسی کامل نسخه ۴.۰ (v4.0.${{ github.run_number }})
          body: |
            📱 **دانلود مستقیم APK نهایی و بازنویسی‌شده (نسخه v4.0.${{ github.run_number }})**
            
            ✅ **تغییرات کلیدی این نسخه:**
            - **اصلاح باگ کپسیتیور در گیت‌هاب (npx cap copy android)**: فورس‌کپی کدهای جدید در APK به طوری که نسخه قدیمی کدهای قبلی به هیچ وجه در اندروید اجرا نشود.
            - **سیستم ۱۰ قلب بصری دقیق (۱۰ ❤️)**: نمایش ۱۰ قلب سرخ در بالای صفحه بازی.
            - **حفظ امتیاز و ۱۰ جان واقعی**: هر بار اشتباه ۱ قلب خاکستری می‌شود، بازیکن به شیشه امن قبلی بازمی‌گردد و بازی ادامه می‌یابد.
            - **کادر باخت فقط پس از اتمام تمام ۱۰ قلب**: تا زمانی که آخرین قلب قرمز باشد کادر باخت باز نمی‌شود.
            - **۶۰ فریم روانی کامل و بدون لگ صوتی**.

            👇 **لینک دانلود مستقیم:**
            `glass-bridge-v4.0.${{ github.run_number }}.apk`
          draft: false
          prerelease: false
          make_latest: true
          files: glass-bridge-v4.0.${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
